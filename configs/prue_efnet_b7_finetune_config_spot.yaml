trainer:
  max_epochs: 350
  log_every_n_steps: 10
  accelerator: "gpu"
  default_root_dir: PRUE_EFNET_B7_finetune_spot
  devices:
    - 0
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_top_k: 1
        save_last: true
        filename: "{epoch}-{val/loss:.2f}"
model:
  class_path: ftw_tools.training.trainers.CustomSemanticSegmentationTask
  init_args:
    loss: "logcoshdice"
    model: "unet"
    backbone: "efficientnet-b7"
    weights: false
    patch_weights: false
    in_channels: 3  # scaled/ TIFFs are RGB (3 bands). Use 4 for RGBN single-window.
    num_classes: 3
    num_filters: 64
    class_weights: [0.2, 0.2, 0.6]
    ignore_index: 3
    lr: 0.001
    patience: 200
    freeze_backbone: false
    freeze_decoder: false
data:
  class_path: ftw_tools.training.datamodules.FTWDataModule
  init_args:
    batch_size: 8
    num_workers: 4
    random_shuffle: true
    num_samples: -1
    train_countries:
      - kenya_spot_processed
    val_countries:
      - kenya_spot_processed
    test_countries:
      - kenya_spot_processed
    temporal_options: random_window  # single-window: use windowB (or windowA / random_window)
    brightness_aug: false
    preprocess_aug: false
    resize_aug: false
    # Single-window: S2 images in scaled/ (no window_a/window_b). scaled/ TIFFs are 3-band RGB.
    single_window_subdirs:
      # country name must match folder name under data/
      kenya_spot_processed: scaled
    single_window_channels: 3  # must match in_channels and actual band count in scaled/
  dict_kwargs:
    root: data
    load_boundaries: true
seed_everything: 42

