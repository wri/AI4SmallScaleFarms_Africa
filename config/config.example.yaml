# Example pipeline configuration.
# Copy to config.yaml and edit the values for your area of interest.
# Any field omitted here falls back to the defaults in src/config.py.

# --- Identity / area of interest ---
area_name: "Nyandarua"            # run label; also the GAUL ADM2 name if gaul_name is omitted
gaul_dataset: "FAO/GAUL/2015/level2"
gaul_name_field: "ADM2_NAME"
# gaul_name: "Nyandarua"          # set when area_name is a run label, not an ADM2 name
# aoi_bbox: [36.2, -0.9, 36.9, -0.1]   # optional [west, south, east, north]
# Local county polygon (shapefile / GeoJSON). Used if the file exists;
# otherwise the pipeline falls back to GAUL (notebook cell 8).
# boundary_path: "data/raw/Nyandarua/Nyandarua_boundary/Nyandarua.shp"

# --- Target label ---
# binary (default): maize vs other from any crop_* column.
# multiclass: cleaned crop_a, rare classes collapsed to other.
label_mode: binary
target_crop_names: ["Maize"]
crop_columns: ["crop_a", "crop_b", "crop_c", "crop_d", "crop_e"]
target_column: "maize_pos"
# label_column: crop_a          # multiclass source column
# min_class_count: 10
# other_class_name: other
# sample_geometry: auto         # auto | point | polygon
# class_weight: balanced        # optional RF class_weight

# --- Growing season / imagery ---
start_date: "2024-03-01"
end_date: "2024-08-31"
# refdate: "2024-03-01"           # defaults to start_date
n_harmonics: 2                    # notebook cells 41 and 95
s2_sr_asset: "COPERNICUS/S2_SR_HARMONIZED"
# precip_reducer: mean            # notebook cell 97 (CHIRPS temporal mean)

# --- CRS / geometry ---
area_calc_epsg: 32636             # UTM zone for planar area (36N = Kenya)
working_epsg: 4326
scale: 30

# --- Paths (relative paths are resolved against project_root) ---
# project_root: "."
# eetc_path: "eetc"               # cloned https://github.com/shrutijain90/eetc
survey_geojson: "data/raw/Nyandarua.geojson"

# --- Earth Engine auth ---
# ee_project: "your-ee-project"
# ee_service_account_key: "path/to/service-account-key.json"
ee_high_volume: false
# reuse_ee_features: true         # skip EE when CSVs / the feature asset exist
# County-wide features are batch-exported to:
#   projects/<ee_project>/assets/<area>_pixel_features_for_rf
# then tiled locally (tiles that miss the county polygon are skipped).

# --- Post-processing ---
# GFSAD 1 km cropland (notebook cell 108). Classes 2-6 = cropland.
cropland_dataset: "USGS/GFSAD1000_V1"
cropland_band: "landcover"
cropland_classes: [2, 3, 4, 5, 6]
cropland_threshold: 40.0          # only used if cropland_classes is empty
probability_threshold: 0.5
