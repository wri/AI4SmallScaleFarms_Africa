trainer:
  max_epochs: 200
  log_every_n_steps: 10
  accelerator: "gpu"
  default_root_dir: PRUE_EFNET_B7_finetune_frozen_backbone
  devices:
    - 0
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_top_k: 1
        save_last: true
        filename: "{epoch}-{val/loss:.2f}"
model:
  class_path: ftw_tools.training.trainers.CustomSemanticSegmentationTask
  init_args:
    loss: "logcoshdice"
    model: "unet"
    backbone: "efficientnet-b7"
    weights: false
    patch_weights: false
    in_channels: 8
    num_classes: 3
    num_filters: 64
    class_weights: [0.05, 0.2, 0.75]
    ignore_index: 3
    lr: 0.001
    patience: 200
    freeze_backbone: true
    freeze_decoder: false
data:
  class_path: ftw_tools.training.datamodules.FTWDataModule
  init_args:
    batch_size: 8
    num_workers: 4
    num_samples: -1
    train_countries:
      - kenya_counties_batch
    val_countries:
      - kenya_counties_batch
    test_countries:
      - kenya_counties_batch
    temporal_options: stacked
    brightness_aug: false
    preprocess_aug: false
    resize_aug: false
  dict_kwargs:
    root: data
    load_boundaries: true
seed_everything: 42

